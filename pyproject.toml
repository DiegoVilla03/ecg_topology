[project]
name = "ecg-topology"
version = "0.1.0"
description = "Topological data analysis of RR-interval series: research prototype for heart failure and AV block detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gudhi>=3.11.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecgtda"]
